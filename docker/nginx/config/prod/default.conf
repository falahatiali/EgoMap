server {
    listen 80;
    server_name egomap.verzav.ir;

    server_tokens off;

    client_max_body_size 10M;

    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /livewire- {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /storage/ {
        try_files $uri =404;

        location ~ \.php$ {
            deny all;
        }
    }

    location ~* \.(env|log|sql|bak|ini|yml|yaml|lock|git|gitignore)$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass egomap:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    error_log /var/log/nginx/egomap_error.log;
    access_log /var/log/nginx/egomap_access.log;
}
